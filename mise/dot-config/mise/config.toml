[settings.python]
compile = false

[settings]
env_cache = true
env_cache_ttl = "1d"

[tools]
aws-cli = "latest"
azure = "2.77.0"
eza = "latest"
fzf = "latest"
github-cli = "latest"
jq = "1.8.1"
neovim = "latest"
node = "24.8.0"
npm = "latest"
python = "3.12"
ripgrep = "latest"
task = "latest"
tree-sitter = "latest"
uv = "0.8.22"
zoxide = "latest"

[env]
AWS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
NODE_EXTRA_CA_CERTS = "/usr/local/share/ca-certificates/zscaler.crt"
