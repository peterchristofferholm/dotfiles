version: '3'

tasks:

  default:
    cmds:
      - task --list-all

  bootstrap:
    alias: bootstrap
    desc: Bootstrap default tools and setup dotfiles
    cmds:
      - task: install-stow
      - task: install-docker
      - task: install-tools
      - task: deploy-bash-config
      - task: deploy-tool-config

  install-stow:
    cmds:
      - sudo apt install stow
    status:
      - command -v stow

  install-docker:
    cmds:
      - bash scripts/install-docker.sh
    status:
      - command -v docker

  install-tools:
    deps: [install-stow]
    cmds:
      - sudo apt install unzip tree
      - stow --dotfiles mise
      - mise install
    status:
      - command -v unzip
      - command -v lazygit
      - command -v tree

  deploy-bash-config:
    cmds:
      - stow --dotfiles --adopt bash 

  deploy-tool-config:
    deps: [install-stow]
    cmds:
      - stow --dotfiles tmux
      - stow --dotfiles mise
      - stow --dotfiles nvim
      - stow --dotfiles utils
      - stow --dotfiles tools
